{% extends "base.html" %}
{% block title %}Reset password — StockRadar{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Reset your password</h1>
  <p class="sub">We'll e-mail you a link to choose a new one.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>E-mail<input type="email" name="email" required autocomplete="email" autofocus></label>
    <button class="btn primary">Send reset link</button>
  </form>
  <p class="small" style="margin-top:16px"><a href="/login">Back to log in</a></p>
</div>
{% endblock %}

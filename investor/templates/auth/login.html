{% extends "base.html" %}
{% block title %}Log in — StockRadar{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to your StockRadar account.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>E-mail<input type="email" name="email" required autocomplete="email" autofocus></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary">Log in</button>
  </form>
  {% include "auth/_google.html" %}
  <p class="small" style="margin-top:16px"><a href="/forgot">Forgot password?</a> · New here? <a href="/signup{{ '?next=' ~ next if next }}">Create a free account</a></p>
</div>
{% endblock %}
